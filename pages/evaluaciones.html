<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Evaluaciones — Sumaq Llank'ay</title>
    <meta
      name="description"
      content="Panel de evaluaciones realizadas. Historial y gestión de usuarios."
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <meta name="theme-color" content="#151b2e" />
  </head>
  <body data-page="evaluaciones">
    <div class="app-layout">
      <div id="sidebar-root"></div>

      <main class="main-content">
        <div class="topbar">
          <div class="topbar-breadcrumb">
            <a href="../index.html">🏠 Inicio</a>
            <span>/</span>
            <span class="current">Mis Evaluaciones</span>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-primary btn-sm" data-action="new">
              ➕ Nueva Evaluación
            </button>
          </div>
        </div>

        <div class="page-header fade-in">
          <p class="page-tag">📋 Panel de Evaluaciones</p>
          <h1>Historial de Evaluaciones</h1>
          <p>Consulta, filtra y accede a todas las evaluaciones realizadas.</p>
        </div>

        <!-- FILTROS -->
        <div class="filter-bar fade-in">
          <input
            class="form-input"
            type="text"
            id="filter-buscar"
            placeholder="🔍 Buscar empresa, trabajador..."
          />
          <select class="form-select" id="filter-estado">
            <option value="">Todos los estados</option>
            <option value="en_progreso">En progreso</option>
            <option value="completada">Completada</option>
          </select>
          <input
            class="form-input"
            type="date"
            id="filter-desde"
            title="Desde"
          />
          <input
            class="form-input"
            type="date"
            id="filter-hasta"
            title="Hasta"
          />
        </div>

        <!-- TABLA DE EVALUACIONES -->
        <div class="card fade-in" id="evaluaciones-card">
          <div id="evaluaciones-table-container">
            <div class="eval-empty">
              <div class="eval-empty-icon">⏳</div>
              <p>Cargando evaluaciones...</p>
            </div>
          </div>
        </div>

        <!-- PANEL ADMIN: CREAR USUARIO (solo visible para admins) -->
        <div id="admin-section" style="display: none">
          <div class="card fade-in mt-xl">
            <div class="card-header">
              <div class="card-icon card-icon-primary">👥</div>
              <div>
                <div class="card-title">Gestión de Usuarios</div>
                <div class="card-subtitle">
                  Crear cuentas de evaluadores y administrar accesos
                </div>
              </div>
            </div>

            <!-- Formulario crear usuario -->
            <div class="form-grid form-grid-2">
              <div class="form-group">
                <label class="form-label" for="new-user-nombre"
                  >Nombre completo <span class="required">*</span></label
                >
                <input
                  class="form-input"
                  type="text"
                  id="new-user-nombre"
                  placeholder="Nombre del evaluador"
                />
              </div>
              <div class="form-group">
                <label class="form-label" for="new-user-email"
                  >Email <span class="required">*</span></label
                >
                <input
                  class="form-input"
                  type="email"
                  id="new-user-email"
                  placeholder="evaluador@empresa.com"
                />
              </div>
              <div class="form-group">
                <label class="form-label" for="new-user-password"
                  >Contraseña <span class="required">*</span></label
                >
                <input
                  class="form-input"
                  type="password"
                  id="new-user-password"
                  placeholder="Mínimo 12 caracteres"
                />
              </div>
              <div class="form-group">
                <label class="form-label" for="new-user-rol">Rol</label>
                <select class="form-select" id="new-user-rol">
                  <option value="evaluador">Evaluador</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>
            </div>
            <div style="margin-top: 1rem">
              <button
                class="btn btn-primary"
                id="btn-crear-usuario"
                data-action="create-user"
              >
                ➕ Crear Usuario
              </button>
              <span
                id="create-user-feedback"
                style="margin-left: 1rem; font-size: 0.82rem"
              ></span>
            </div>

            <!-- Lista de usuarios -->
            <div class="admin-panel">
              <div
                style="
                  font-weight: 700;
                  font-size: 0.9rem;
                  margin-bottom: 0.5rem;
                "
              >
                Usuarios registrados
              </div>
              <div id="admin-user-list" class="admin-user-list">
                <div class="eval-empty"><p>Cargando usuarios...</p></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
