project_id = "sumaq-local"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/pages/login.html?flow=recovery", "http://localhost:5173/pages/login.html?flow=recovery"]
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[functions.siga-api]
# La función verifica cada JWT con auth.getUser(). La clave de mantenimiento es independiente.
verify_jwt = false
